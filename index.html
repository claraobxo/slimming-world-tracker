<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3ef"><title>My Food Diary</title>
<style>
:root{--bg:#f8f5f2;--card:#fff;--text:#292522;--muted:#857d77;--accent:#8d5365;--accent2:#ead8de;--line:#ece6e1;--green:#54755e;--gold:#a27a3c;--danger:#a94b4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:86px}.header{padding:22px 18px 10px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}h1{font-size:28px;margin:5px 0}.date{color:var(--muted);font-size:14px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}.tabs button{border:0;background:none;color:var(--muted);padding:12px 22px 10px;min-width:105px}.tabs button.active{color:var(--accent);font-weight:700}.tab-icon{font-size:20px;display:block}.screen{padding:8px 16px}.syn-card{background:var(--accent);color:#fff;border-radius:22px;padding:20px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}.syn-label{font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:1.2px}.syn-total{font-size:31px;font-weight:750}.progress{height:6px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:10px;overflow:hidden}.progress span{display:block;height:100%;background:#fff;border-radius:9px}.section{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden}.section-head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line)}.section-head h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:1px}.add{border:0;background:var(--accent2);color:var(--accent);border-radius:20px;padding:7px 11px;font-weight:700}.food-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}.food-row:last-child{border-bottom:0}.food-name{font-weight:600}.tag{font-size:11px;padding:4px 7px;border-radius:8px;margin-left:8px;white-space:nowrap}.syn{background:#f2e3e7;color:#8d5365}.free{background:#e7f0e9;color:var(--green)}.speed{background:#eef3df;color:#60743d}.a{background:#f7ecd8;color:var(--gold)}.b{background:#e5edf4;color:#4e6f8c}.fat{background:#efe7d5;color:#80652f}.food-meta{font-size:12px;color:var(--muted);margin-top:3px}.right{display:flex;align-items:center}.delete{border:0;background:none;color:#b5aaa3;margin-left:8px;font-size:18px}.empty{padding:18px 16px;color:var(--muted);font-size:14px}.searchbar{display:flex;gap:8px;margin:8px 0 14px}.searchbar input{flex:1}.input,.select{width:100%;padding:12px 13px;border:1px solid var(--line);background:#fff;border-radius:12px;outline:none}.primary{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700}.secondary{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:11px 14px}.page-title{font-size:22px;margin:8px 0 16px}.list-card{background:#fff;border:1px solid var(--line);border-radius:16px;margin:10px 0;padding:15px}.list-card-top{display:flex;justify-content:space-between;align-items:center}.pill{font-size:11px;padding:5px 8px;border-radius:9px}.calendar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cal-head button{border:0;background:none;font-size:20px}.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow div{text-align:center;color:var(--muted);font-size:11px;padding:5px}.day{min-height:52px;border:0;background:#faf8f6;border-radius:10px;padding:5px;text-align:left}.day.muted{opacity:.35}.day.today{outline:2px solid var(--accent)}.day-num{font-size:12px}.day-syn{text-align:center;font-size:11px;font-weight:700;color:var(--accent);margin-top:5px}.modal-bg{position:fixed;inset:0;background:rgba(30,25,22,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50}.modal{background:var(--bg);width:100%;max-width:620px;border-radius:24px 24px 0 0;padding:20px 18px 30px;max-height:88vh;overflow:auto}.modal h2{margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.choice button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 3px;font-size:11px}.choice button.selected{background:var(--accent2);border-color:var(--accent);color:var(--accent);font-weight:700}.modal-actions{display:flex;gap:8px;margin-top:18px}.modal-actions button{flex:1}.hidden{display:none!important}.section-note{color:var(--muted);font-size:13px;margin:-8px 0 14px}.meal-ingredients{font-size:13px;color:var(--muted);line-height:1.5}.top-actions{display:flex;gap:8px;margin-bottom:14px}.top-actions button{flex:1}.day-detail{margin-top:14px}.back{border:0;background:none;color:var(--accent);padding:0 0 10px;font-weight:700}
</style></head><body><div class="app"><div id="app"></div></div><nav class="tabs"><button data-tab="today" class="active"><span class="tab-icon">＋</span>Today</button><button data-tab="history"><span class="tab-icon">▦</span>History</button><button data-tab="foods"><span class="tab-icon">♡</span>My Foods</button></nav><div id="modalRoot"></div>
<script>
const KEY='swDiaryV1';
const defaultFoods=[

 {id:'f23',name:'Chickpeas',type:'Free',syns:0,portion:'As desired'},
 {id:'f24',name:'Black beans',type:'Free',syns:0,portion:'As desired'},
 {id:'f25',name:'Broccoli',type:'Speed',syns:0,portion:'As desired'},
 {id:'f26',name:'Avocado',type:'Healthy Fat',syns:0,portion:'Measured Healthy Fat portion'},
 {id:'f27',name:'Almonds',type:'Healthy Fat',syns:0,portion:'Measured Healthy Fat portion'},
 {id:'f28',name:'Chia seeds',type:'Healthy Fat',syns:0,portion:'Measured Healthy Fat portion'},
 {id:'f29',name:'Popcorn, Metcalfe’s Skinny Popcorn 11g bag',type:'Syn',syns:2.5,portion:'1 x 11g bag'},
 {id:'f30',name:'Sweet popcorn',type:'Syn',syns:6,portion:'25g'},
 {id:'f31',name:'Diet fizzy drink',type:'Free',syns:0,portion:'As desired'},
 {id:'f32',name:'Sugar-free cordial',type:'Free',syns:0,portion:'As desired'},
 {id:'f33',name:'Sweetener',type:'Free',syns:0,portion:'Check product'},
 {id:'f34',name:'1-cal cooking spray',type:'Free',syns:0,portion:'As directed'},

 {id:'f40',name:'Salad vegetables',type:'Speed',syns:0,portion:'As desired'},
 {id:'f41',name:'Tuna',type:'Free',syns:0,portion:'In spring water/brine'},

 {id:'f45',name:'Tomatoes',type:'Speed',syns:0,portion:'As desired'},
 {id:'f46',name:'Peppers',type:'Speed',syns:0,portion:'As desired'},
 {id:'f47',name:'Onion',type:'Speed',syns:0,portion:'As desired'},
 {id:'f48',name:'Plain flour',type:'Syn',syns:0,portion:'Value varies by amount'},
 {id:'f49',name:'Avocado oil',type:'Healthy Fat',syns:0,portion:'Measured Healthy Fat portion'},
 {id:'f50',name:'Cucumber',type:'Free',syns:0,portion:'As desired'},
 {id:'f51',name:'Lettuce',type:'Speed',syns:0,portion:'As desired'},
 {id:'f52',name:'Carrots',type:'Speed',syns:0,portion:'As desired'},
 {id:'f53',name:'Mushrooms',type:'Speed',syns:0,portion:'As desired'},

 {id:'f55',name:'Courgette',type:'Speed',syns:0,portion:'As desired'},
 {id:'f56',name:'Spinach',type:'Speed',syns:0,portion:'As desired'},
 {id:'f57',name:'Chicken mince',type:'Free',syns:0,portion:'Lean version'},
 {id:'f58',name:'Salmon',type:'Free',syns:0,portion:'Plain, unbreaded'},
 {id:'f59',name:'Prawns',type:'Free',syns:0,portion:'Plain'},
 {id:'f60',name:'Beans in tomato sauce',type:'Free',syns:0,portion:'Check product-specific value'},
 {id:'f61',name:'Passata',type:'Free',syns:0,portion:'Plain'},
 {id:'f62',name:'Balsamic vinegar',type:'Free',syns:0,portion:'Check product'},
 {id:'f63',name:'Soy sauce',type:'Free',syns:0,portion:'Check product'},
 {id:'f64',name:'Garlic granules',type:'Free',syns:0,portion:'Small amount'},
 {id:'f65',name:'Chilli flakes',type:'Free',syns:0,portion:'Small amount'},
 {id:'f66',name:'Protein powder',type:'Syn',syns:0,portion:'Brand/amount dependent — enter your value'},
 {id:'f67',name:'Granola',type:'Syn',syns:0,portion:'Brand/portion dependent — enter your value'},
 {id:'f68',name:'Honey',type:'Syn',syns:0,portion:'Brand/amount dependent — enter your value'},
 {id:'f69',name:'Peanut butter',type:'Syn',syns:0,portion:'Brand/amount dependent — enter your value'}
];
const starterMeals=[
 {id:'m1',name:'Slimming World Overnight Oats',syns:7,ingredients:['Porridge oats','Fat-free Greek yoghurt','Nectarines','Vanilla extract','Cinnamon'],note:'Official Slimming World recipe: 7 Swips/Syns per serving, or deduct 7 when the oats are counted as the Healthy Extra fibre choice.'},
 {id:'m2',name:'Chia Pudding',syns:0,ingredients:['Chia seeds','Almond milk, unsweetened','Berries'],note:'Starter meal from your usual ingredients. Set the meal value to your own portion-specific value before relying on it.'},
 {id:'m3',name:'Simple Chicken Pasta',syns:0,ingredients:['Chicken breast','Pasta','Tomato passata','Peppers','Onion'],note:'Starter meal template. Set the total Syn value for your own recipe.'}
];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{diary:{},foods:defaultFoods,meals:[],settings:{target:15}};
state.settings=state.settings||{target:15};
state.foods=state.foods||[];
// Add new starter foods without overwriting foods you have already edited or added.
defaultFoods.forEach(f=>{if(!state.foods.some(x=>x.name.toLowerCase()===f.name.toLowerCase()))state.foods.push(f)});
state.meals=state.meals||[];
starterMeals.forEach(m=>{if(!state.meals.some(x=>x.name.toLowerCase()===m.name.toLowerCase()))state.meals.push({...m,ingredients:m.ingredients.map(n=>state.foods.find(f=>f.name===n)).filter(Boolean)})});
save(); let tab='today';let selectedDate=iso(new Date());let calDate=new Date();let pendingSection=null;let mealIngredients=[];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function dayData(date=selectedDate){if(!state.diary[date])state.diary[date]={breakfast:[],lunch:[],dinner:[],snacks:[]};return state.diary[date]}function synTotal(date=selectedDate){return Object.values(dayData(date)).flat().reduce((s,x)=>s+(Number(x.syns)||0),0)}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function tag(type,syns){let c=type==='Free'?'free':type==='Speed'?'speed':type==='Healthy A'?'a':type==='Healthy B'?'b':type==='Healthy Fat'?'fat':'syn';let txt=type==='Syn'?`${syns} Syns`:type;return `<span class="tag ${c}">${txt}</span>`}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('app').innerHTML=tab==='today'?todayHTML():tab==='history'?historyHTML():foodsHTML()}
function todayHTML(){let d=dayData();let total=synTotal();return `<header class="header"><div class="eyebrow">My Food Diary</div><div style="display:flex;align-items:center;justify-content:space-between"><button class="back" onclick="changeDay(-1)">‹</button><h1 style="margin:5px 0">${selectedDate===iso(new Date())?'Today':new Date(selectedDate+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}</h1><button class="back" onclick="changeDay(1)">›</button></div><div class="date">${fmt(selectedDate)}</div></header><main class="screen"><div class="syn-card"><div><div class="syn-label">Syns used</div><div class="syn-total">${total} / ${state.settings.target}</div><div class="progress"><span style="width:${Math.min(total/state.settings.target*100,100)}%"></span></div></div><div style="font-size:30px">${total>state.settings.target?'!':'✓'}</div></div>${section('breakfast','Breakfast',d.breakfast)}${section('lunch','Lunch',d.lunch)}${section('dinner','Dinner',d.dinner)}${section('snacks','Snacks',d.snacks)}</main>`}
function section(key,title,items){return `<section class="section"><div class="section-head"><h3>${title}</h3><button class="add" onclick="openAdd('${key}')">+ Add</button></div>${items.length?items.map((x,i)=>`<div class="food-row"><div><div class="food-name">${esc(x.name)}</div><div class="food-meta">${x.meal?'Saved meal · ':''}${x.type==='Syn'?x.syns+' Syns':x.type}</div></div><div class="right">${tag(x.type,x.syns)}<button class="delete" onclick="removeEntry('${key}',${i})">×</button></div></div>`).join(''):`<div class="empty">Nothing logged yet</div>`}</section>`}
function historyHTML(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells=[];for(let i=0;i<start;i++)cells.push('<div></div>');for(let n=1;n<=days;n++){let date=iso(new Date(y,m,n)),has=state.diary[date]&&Object.values(state.diary[date]).some(a=>a.length);cells.push(`<button class="day ${date===iso(new Date())?'today':''}" onclick="viewDate('${date}')"><div class="day-num">${n}</div>${has?`<div class="day-syn">${synTotal(date)} Syn</div>`:''}</button>`)}return `<header class="header"><div class="eyebrow">Your diary</div><h1>History</h1></header><main class="screen"><div class="calendar"><div class="cal-head"><button onclick="moveMonth(-1)">‹</button><strong>${new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</strong><button onclick="moveMonth(1)">›</button></div><div class="dow">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div>${x}</div>`).join('')}</div><div class="grid">${cells.join('')}</div></div><div id="dayDetail"></div></main>`}
function foodsHTML(){return `<header class="header"><div class="eyebrow">Your database</div><h1>My Foods</h1></header><main class="screen"><div class="top-actions"><button class="primary" onclick="openFoodModal()">+ Add Food</button><button class="secondary" onclick="openMealModal()">+ Create Meal</button></div><div class="top-actions"><button class="secondary" onclick="openSettings()">⚙ Syn target</button></div><input class="input" id="foodSearch" placeholder="Search foods or meals..." oninput="renderFoodList()"><div id="foodList"></div></main>`}
function renderFoodList(){let q=(document.getElementById('foodSearch')?.value||'').toLowerCase();let foods=state.foods.filter(f=>f.name.toLowerCase().includes(q));let meals=state.meals.filter(f=>f.name.toLowerCase().includes(q));let html=meals.map(m=>`<div class="list-card"><div class="list-card-top"><strong>${esc(m.name)}</strong><div>${tag('Syn',m.syns)}<button class="delete" onclick="editMeal('${m.id}')">✎</button><button class="delete" onclick="deleteMeal('${m.id}')">×</button></div></div><div class="meal-ingredients">Saved meal · ${esc(m.ingredients.map(i=>i.name).join(', '))}</div>${m.note?`<div class="section-note" style="margin-top:7px">${esc(m.note)}</div>`:''}</div>`).join('');html+=foods.map(f=>`<div class="list-card"><div class="list-card-top"><strong>${esc(f.name)}</strong><div>${tag(f.type,f.syns)}<button class="delete" onclick="editFood('${f.id}')">✎</button><button class="delete" onclick="deleteFood('${f.id}')">×</button></div><div class="food-meta">${esc(f.portion||'')}</div></div>`).join('');document.getElementById('foodList').innerHTML=html||'<div class="empty">No foods found.</div>'}
function openAdd(key){pendingSection=key;let modal=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><h2>Add to ${key==='breakfast'?'Breakfast':key==='lunch'?'Lunch':key==='dinner'?'Dinner':'Snacks'}</h2><input class="input" id="addSearch" placeholder="Search your foods and meals" oninput="renderAddChoices('${key}')"><div id="addChoices" style="margin-top:12px"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="openFoodModal(true)">+ New Food</button></div></div></div>`;document.getElementById('modalRoot').innerHTML=modal;renderAddChoices(key)}
function renderAddChoices(key){let q=(document.getElementById('addSearch')?.value||'').toLowerCase();let foods=state.foods.filter(f=>f.name.toLowerCase().includes(q));let meals=state.meals.filter(f=>f.name.toLowerCase().includes(q));let h=meals.map(m=>`<button class="list-card" style="width:100%;text-align:left;border:1px solid var(--line)" onclick="addEntry('${key}',${JSON.stringify(m).replace(/"/g,'&quot;')},true)"><div class="list-card-top"><strong>${esc(m.name)}</strong>${tag('Syn',m.syns)}</div><div class="meal-ingredients">Saved meal</div></button>`).join('');h+=foods.map(f=>`<button class="list-card" style="width:100%;text-align:left;border:1px solid var(--line)" onclick="addEntry('${key}',${JSON.stringify(f).replace(/"/g,'&quot;')},false)"><div class="list-card-top"><strong>${esc(f.name)}</strong>${tag(f.type,f.syns)}</div></button>`).join('');document.getElementById('addChoices').innerHTML=h||'<div class="empty">No match. Add a new food below.</div>'}
function addEntry(key,obj,isMeal){let x={name:obj.name,type:isMeal?'Syn':obj.type,syns:isMeal?obj.syns:obj.syns,meal:isMeal};dayData()[key].push(x);save();closeModal();render()}
function removeEntry(key,i){dayData()[key].splice(i,1);save();render()}
function openFoodModal(fromAdd=false){pendingSection=fromAdd?pendingSection:null;document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><h2>Add Food</h2><div class="field"><label>Food name</label><input class="input" id="newName" placeholder="e.g. Avocado"></div><div class="field"><label>Classification</label><div class="choice">${['Free','Speed','Healthy A','Healthy B','Healthy Fat','Syn'].map((x,i)=>`<button class="${i===0?'selected':''}" data-type="${x}" onclick="selectType(this)">${x}</button>`).join('')}</div></div><div class="field" id="synField"><label>Syn value</label><input class="input" id="newSyn" type="number" min="0" step="0.5" value="0"></div><div class="field"><label>Portion / notes</label><input class="input" id="newPortion" placeholder="e.g. 1 tbsp, 40g, 2 slices"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveFood()">Save Food</button></div></div></div>`}
function selectType(btn){document.querySelectorAll('.choice button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');document.getElementById('synField').style.display=btn.dataset.type==='Syn'?'block':'none'}
function saveFood(){let name=document.getElementById('newName').value.trim();let type=document.querySelector('.choice button.selected').dataset.type;let syn=type==='Syn'?Number(document.getElementById('newSyn').value||0):0;if(!name)return alert('Please enter a food name.');let food={id:Date.now().toString(),name,type,syns:syn,portion:document.getElementById('newPortion').value.trim()};state.foods.unshift(food);save();closeModal();if(pendingSection){let key=pendingSection;pendingSection=null;dayData()[key].push({name:food.name,type:food.type,syns:food.syns,meal:false});save();}render();if(tab==='foods')setTimeout(renderFoodList,0)}
function openMealModal(){mealIngredients=[];document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><h2>Create Meal</h2><div class="field"><label>Meal name</label><input class="input" id="mealName" placeholder="e.g. Overnight Oats"></div><div class="field"><label>Ingredients / foods</label><input class="input" id="mealSearch" placeholder="Search and add foods" oninput="mealChoices()"><div id="mealChoices"></div><div id="selectedIngredients" style="margin-top:8px"></div></div><div class="field"><label>Total Syns for this meal</label><input class="input" id="mealSyn" type="number" min="0" step="0.5" value="0"><div class="section-note" style="margin-top:6px">Enter the total Syns for the full meal. Free foods and Healthy Extras can be included in the ingredients list.</div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveMeal()">Save Meal</button></div></div></div>`;mealChoices()}
function mealChoices(){let q=(document.getElementById('mealSearch')?.value||'').toLowerCase();let list=state.foods.filter(f=>f.name.toLowerCase().includes(q)).slice(0,8);document.getElementById('mealChoices').innerHTML=list.map(f=>`<button class="secondary" style="margin:5px 5px 0 0" onclick='addIngredient(${JSON.stringify(f)})'>+ ${esc(f.name)}</button>`).join('');document.getElementById('selectedIngredients').innerHTML=mealIngredients.map((f,i)=>`<span class="pill" style="background:#eee;margin:3px;display:inline-block">${esc(f.name)} <button style="border:0;background:none" onclick="mealIngredients.splice(${i},1);mealChoices()">×</button></span>`).join('')}
function addIngredient(f){if(!mealIngredients.some(x=>x.id===f.id)){mealIngredients.push(f)}mealChoices()}
function saveMeal(){let name=document.getElementById('mealName').value.trim();let syn=Number(document.getElementById('mealSyn').value||0);if(!name)return alert('Please enter a meal name.');state.meals.unshift({id:Date.now().toString(),name,syns:syn,ingredients:mealIngredients});mealIngredients=[];save();closeModal();render();if(tab==='foods')renderFoodList()}
function closeModal(e){if(!e||e.target.classList.contains('modal-bg'))document.getElementById('modalRoot').innerHTML=''}
function moveMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);render()}
function viewDate(date){selectedDate=date;tab='today';render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab!=='today')selectedDate=iso(new Date());render();if(tab==='foods')setTimeout(renderFoodList,0)});render();
</script>
<script>
function changeDay(n){selectedDate=iso(new Date(new Date(selectedDate+'T12:00:00').getTime()+n*86400000));render()}
function openSettings(){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><h2>Settings</h2><div class="field"><label>Daily Syn target</label><input class="input" id="targetInput" type="number" min="0" step="0.5" value="${state.settings.target}"><div class="section-note" style="margin-top:6px">Your personal target — change this whenever you need.</div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveSettings()">Save</button></div></div></div>`}
function saveSettings(){state.settings.target=Number(document.getElementById('targetInput').value||15);save();closeModal();render()}
function deleteFood(id){if(confirm('Delete this food from your database?')){state.foods=state.foods.filter(f=>f.id!==id);save();renderFoodList()}}
function deleteMeal(id){if(confirm('Delete this saved meal?')){state.meals=state.meals.filter(m=>m.id!==id);save();renderFoodList()}}
function editFood(id){let f=state.foods.find(x=>x.id===id);if(!f)return;openFoodModal();setTimeout(()=>{document.getElementById('newName').value=f.name;document.querySelectorAll('.choice button').forEach(b=>b.classList.toggle('selected',b.dataset.type===f.type));document.getElementById('synField').style.display=f.type==='Syn'?'block':'none';document.getElementById('newSyn').value=f.syns||0;document.getElementById('newPortion').value=f.portion||'';document.querySelector('.modal .primary').onclick=()=>{f.name=document.getElementById('newName').value.trim();f.type=document.querySelector('.choice button.selected').dataset.type;f.syns=f.type==='Syn'?Number(document.getElementById('newSyn').value||0):0;f.portion=document.getElementById('newPortion').value.trim();save();closeModal();renderFoodList()}},0)}
function editMeal(id){let m=state.meals.find(x=>x.id===id);if(!m)return;openMealModal();setTimeout(()=>{mealIngredients=[...m.ingredients];setTimeout(()=>{document.getElementById('mealName').value=m.name;document.getElementById('mealSyn').value=m.syns;mealChoices();document.querySelector('.modal .primary').onclick=()=>{m.name=document.getElementById('mealName').value.trim();m.syns=Number(document.getElementById('mealSyn').value||0);m.ingredients=[...mealIngredients];mealIngredients=[];save();closeModal();renderFoodList()}},0)},0)}
</script>

</body></html>
